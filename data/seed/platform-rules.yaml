common_eligibility_notes:
  - 扫码结果明确拒收时不能进入订单
  - 影响正常阅读的实体书不应提交
  - 来源非法的图书不应提交
  - 无法验证为正版的图书不应提交

modeling_assumptions:
  - 每个拆分订单必须单独满足该平台至少一个有效订单模式
  - 金额门槛按订单内书籍的预估报价总和计算
  - 数量门槛按订单内已确认接收的实体册数量计算
  - 所有有效订单的上门费用按0分计算
  - 到仓复检降价、拒收和退回费用不进入第一阶段确定性求解
  - 未给出订单上限的平台在第一阶段不设置数量上限
