server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Match the backend multipart request limit (1100 KB, using 1024-byte units).
    client_max_body_size 1100k;

    location /backend/ {
        # The trailing slash removes the public /backend/ prefix upstream.
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /backend;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
