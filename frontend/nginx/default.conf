map $http_x_forwarded_proto $books_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_port $books_forwarded_port {
    default $http_x_forwarded_port;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Match the backend multipart request limit (1100 KB, using 1024-byte units).
    client_max_body_size 1100k;

    location /backend/ {
        # The trailing slash removes the public /backend/ prefix upstream.
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        # Preserve an outer TLS proxy's metadata. On direct loopback access the
        # port header stays absent, so Spring can infer :18081 from $http_host
        # instead of incorrectly treating Nginx's internal port 80 as public.
        proxy_set_header X-Forwarded-Port $books_forwarded_port;
        proxy_set_header X-Forwarded-Proto $books_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /backend;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
