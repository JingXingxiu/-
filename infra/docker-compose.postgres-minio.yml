name: books-postgres-minio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-book_decision}
      POSTGRES_USER: ${POSTGRES_USER:-book_decision_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private infra/.env file}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - data
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 128
    shm_size: 128m
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the private infra/.env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the private infra/.env file}
      MINIO_BROWSER: "off"
    expose:
      - "9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "3"
        - http://127.0.0.1:9000/minio/health/ready
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - data
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 192
    logging: *default-logging

  backend:
    image: books-backend:postgres-minio
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-book_decision}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-book_decision_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private infra/.env file}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
      SPRING_FLYWAY_ENABLED: "true"
      BOOK_DECISION_DATASET_PROVIDER: postgres
      BOOK_DECISION_PLATFORM_DISPLAY_MODE: ${PLATFORM_DISPLAY_MODE:-real}
      USER_DATASET_ENABLED: ${USER_DATASET_ENABLED:-true}
      USER_DATASET_RETENTION_DAYS: ${USER_DATASET_RETENTION_DAYS:-30}
      USER_DATASET_MAX_RETAINED_UPLOADS: ${USER_DATASET_MAX_RETAINED_UPLOADS:-100}
      USER_DATASET_MAX_RETAINED_BYTES: ${USER_DATASET_MAX_RETAINED_BYTES:-52428800}
      USER_DATASET_RATE_LIMIT_MAX_UPLOADS: ${USER_DATASET_RATE_LIMIT_MAX_UPLOADS:-10}
      USER_DATASET_RATE_LIMIT_WINDOW_SECONDS: ${USER_DATASET_RATE_LIMIT_WINDOW_SECONDS:-60}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the private infra/.env file}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the private infra/.env file}
      MINIO_BUCKET: ${MINIO_BUCKET:-book-decision-private-uploads}
      ADMIN_API_ENABLED: ${ADMIN_API_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SOLVER_WORKER_COUNT: ${SOLVER_WORKER_COUNT:-1}
      SOLVER_MAX_CONCURRENT_REQUESTS: ${SOLVER_MAX_CONCURRENT_REQUESTS:-2}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Flyway's INFO banner contains the internal JDBC URL; migrations are verified from
      # flyway_schema_history instead of exposing that connection string in container logs.
      LOGGING_LEVEL_ORG_FLYWAYDB: WARN
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=20.0
        -XX:MaxRAMPercentage=55.0
        -XX:+ExitOnOutOfMemoryError
        -Djava.io.tmpdir=/tmp
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "3"
        - http://127.0.0.1:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - edge
      - data
    read_only: true
    tmpfs:
      # OR-Tools extracts libjniortools.so below java.io.tmpdir and loads it at
      # runtime, so this otherwise isolated tmpfs must permit native execution.
      - /tmp:rw,exec,nosuid,nodev,size=128m,mode=1777
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s
    logging: *default-logging

  web:
    image: books-web:postgres-minio
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - edge
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging

volumes:
  postgres-data:
    name: books-postgres16-data
  minio-data:
    name: books-minio-data

networks:
  edge:
    name: books-edge
  data:
    name: books-data
    internal: true
